<section
  class="absolute top-0 left-0 right-0 bottom-0 flex flex-col justify-center items-center w-full"
>
  <section
    class="relative bg-white/90 rounded-2xl p-5 flex flex-col justify-center items-center w-full max-w-125"
  >
    <section class="text-center">
      <h1 class="font-bold text-3xl">Account Recovery</h1>
      <h2 class="font-semibold text-sm text-center mt-5 text-gray-400">
        We will send instructions to your email on how to recover your password
      </h2>
    </section>
    <form [formGroup]="form" (ngSubmit)="submitForm()" class="form-global mt-5">
      <app-error [errorMessage]="error"></app-error>
      <app-form
        [formGroups]="form"
        [label]="'Email'"
        [inputId]="'email'"
        [inputType]="'text'"
        [InputFormControlName]="'email'"
        [inputState]="emailState()"
        [placeHolder]="'you@Example.com'"
      ></app-form>
      <button
        type="submit"
        [disabled]="!formState()"
        [ngClass]="{
          'btn-global': true,
          'bg-black/10': !formState(),
          'hover:scale-[1.0]': !formState(),
          'cursor-default': !formState(),
        }"
      >
        Send
      </button>
    </form>
    >
    <section class="absolute bottom-0 rounded-b-2xl bg-[#F8FAFC] w-full">
      <a routerLink="/" class="flex flex-row gap-2 items-center text-sm justify-center my-4">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1"
          stroke="currentColor"
          class="size-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6.75 15.75 3 12m0 0 3.75-3.75M3 12h18"
          />
        </svg>
        Go back
      </a>
    </section>
  </section>
</section>
